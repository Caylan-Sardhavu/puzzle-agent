[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Caylan Sardhavu", email = "caylansardhavu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "botocore[crt]>=1.44.9",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
 
[tool.pyright]
include = ["src", "tests"]
